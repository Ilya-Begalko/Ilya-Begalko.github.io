<section class="intro">
  <p class="role">{{ profile.role }} · {{ profile.location }}</p>

  <h2>Experience</h2>
  <ul class="experience">
    @for (job of experience; track job.period) {
      <li>
        <span>{{ job.role }}</span>
        <span class="place">{{ job.place }}</span>
        <span class="period">{{ job.period }}</span>
      </li>
    }
  </ul>

  <h2>Education</h2>
  <p class="education">{{ profile.education }}</p>

  <h2>Stack</h2>
  <dl class="stack">
    @for (group of stack; track group.title) {
      <div>
        <dt>{{ group.title }}</dt>
        <dd>{{ group.items }}</dd>
      </div>
    }
  </dl>
</section>
